<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VitaBand · El Lenguaje Silencioso del Corazón</title>
<style>
:root{--em:#10B981;--em2:#34d399;--obs:#07100D;--pine:#132A23;--tx:#E7F5EF;--mut:#8fb8a8;--red:#f87171;--amb:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",Calibri,Arial,sans-serif;color:var(--tx)}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:linear-gradient(160deg,var(--obs),var(--pine));overflow:hidden;font-size:16px;user-select:none}
#stage.idle{cursor:none}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.scene.active{opacity:1}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.7) 100%);z-index:5}
.glass,.card{background:rgba(22,44,37,.46);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(38,75,63,.95);border-radius:1.1em;box-shadow:0 .6em 2em rgba(0,0,0,.35)}
.card{position:absolute;padding:.9em 1.1em;font-size:1em}
.card.red{border-color:rgba(239,68,68,.5);background:rgba(70,20,24,.42)}
.card h4{font-size:.66em;letter-spacing:.16em;text-transform:uppercase;color:#7fd8b6;font-weight:600;margin-bottom:.4em}
.card.red h4{color:#fca5a5}
.card p{font-size:.92em;line-height:1.35;color:#cfe8dd}
.card small{font-size:.74em;color:var(--mut)}
.big{font-size:3em;font-weight:700;color:var(--em);line-height:1.05}
.big.r{color:var(--red)}
.pill{display:inline-block;font-size:.72em;padding:.25em .8em;border-radius:2em;border:1px solid rgba(38,75,63,.95);background:rgba(16,185,129,.14);color:#9bf0cf;margin:.2em .3em 0 0}
.pill.am{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.5);color:#fcd34d}
[data-at]{opacity:0;transform:translateY(.7em);transition:opacity .7s ease,transform .7s ease}
[data-at].on{opacity:1;transform:none}
svg [data-at],svg [data-at].on{transform:none}
.tag{position:absolute;font-size:.7em;padding:.25em .8em;border-radius:2em;background:rgba(7,16,13,.6);border:1px solid rgba(38,75,63,.95);white-space:nowrap}
/* HUD */
#hud{position:absolute;left:3.2%;top:4%;z-index:6}
#act{font-size:.7em;letter-spacing:.22em;color:var(--em);font-weight:700}
#scn{font-size:1.25em;font-weight:600;margin-top:.2em}
#scn small{font-size:.6em;color:var(--mut);letter-spacing:.1em;margin-left:.6em}
#bpm{position:absolute;right:3.2%;top:3.6%;z-index:6;display:flex;align-items:center;gap:.7em;padding:.5em 1.1em;transition:border-color .5s}
#bpm svg{width:1.8em;height:1.8em}
#bpmN{font-size:2.3em;font-weight:700;color:var(--em);line-height:1;min-width:1.7em;text-align:right;transition:color .5s}
#bpmL{font-size:.62em;letter-spacing:.1em;color:var(--mut);max-width:9em;line-height:1.3}
#stage.warn #bpm{border-color:rgba(239,68,68,.6)}#stage.warn #bpmN{color:var(--red)}
.beat{transform-box:fill-box;transform-origin:center;transform:scale(calc(1 + var(--p,0)*.3))}
/* ECG */
#ecg{position:absolute;left:50%;transform:translateX(-50%);bottom:17.2%;width:58%;height:14.6%;z-index:6;padding:.35em .7em .2em}
#ecg .lb{display:flex;justify-content:space-between;font-size:.58em;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
#ecg canvas{width:100%;height:calc(100% - 1.3em);display:block}
#stage.warn #ecgM{color:var(--red)}
#sub{position:absolute;left:50%;transform:translateX(-50%);bottom:9.2%;z-index:7;max-width:78%;text-align:center;font-size:1.12em;line-height:1.35;padding:.55em 1.4em;border-radius:2em;background:rgba(7,16,13,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(38,75,63,.9);opacity:0;transition:opacity .5s}
#sub.in{opacity:1}
/* controles */
#ctrl{position:absolute;left:50%;transform:translateX(-50%);bottom:2.2%;z-index:9;display:flex;align-items:center;gap:.5em;padding:.4em .9em;transition:opacity .5s,transform .5s}
#ctrl.hide{opacity:0;transform:translate(-50%,1em);pointer-events:none}
#ctrl button{background:none;border:1px solid transparent;color:var(--tx);font:inherit;font-size:1.05em;width:2.2em;height:2.2em;border-radius:50%;cursor:pointer}
#ctrl button:hover{background:rgba(16,185,129,.2)}
#ctrl button.pl{background:var(--em);color:#04110c}
#ctrl button.tg{width:auto;border-radius:2em;padding:0 .9em;font-size:.8em;border-color:rgba(38,75,63,.95);color:var(--mut)}
#ctrl button.tg.on{background:rgba(16,185,129,.25);color:#9bf0cf;border-color:var(--em)}
#prog{position:relative;width:15em;height:.45em;background:rgba(255,255,255,.12);border-radius:1em;cursor:pointer;margin:0 .4em}
#prog i{position:absolute;left:0;top:0;bottom:0;background:var(--em);border-radius:1em;width:0}
#prog b{position:absolute;top:-.15em;width:2px;height:.75em;background:rgba(255,255,255,.35)}
#tm{font-size:.78em;color:var(--mut);min-width:6.5em;text-align:center;font-variant-numeric:tabular-nums}
/* intro */
#intro{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse at center,rgba(19,42,35,.92),rgba(7,16,13,.98))}
#intro h1{font-size:4.4em;letter-spacing:.3em;font-weight:300;margin-left:.3em}
#intro h1 b{color:var(--em);font-weight:700}
#intro p{color:var(--mut);margin:.6em 0 1.8em;font-size:1.1em;letter-spacing:.06em}
#intro button{font:inherit;cursor:pointer;border-radius:3em;padding:.75em 2.2em;font-size:1.05em;margin:.3em;border:1px solid var(--em);background:var(--em);color:#04110c;font-weight:700;box-shadow:0 0 2.5em rgba(16,185,129,.4)}
#intro button.s{background:none;color:var(--mut);border-color:rgba(38,75,63,.95);box-shadow:none;font-weight:400}
#intro .ec{width:46%;margin-bottom:1em}
#stage.paused *{animation-play-state:paused!important}
/* animaciones personajes */
.lg,.kn,.am{animation-duration:var(--rd,.7s);animation-iteration-count:infinite}
.lg{animation-name:lg;animation-timing-function:ease-in-out}.kn{animation-name:kn;animation-timing-function:linear}.am{animation-name:am;animation-timing-function:ease-in-out}
.el{transform:rotate(-85deg)}
.bob{animation:bob calc(var(--rd,.7s)/2) ease-in-out infinite}
.br{animation:br 3.6s ease-in-out infinite;transform-origin:0 0}
@keyframes lg{0%,100%{transform:rotate(-45deg)}50%{transform:rotate(38deg)}}
@keyframes kn{0%,100%{transform:rotate(15deg)}40%{transform:rotate(25deg)}55%{transform:rotate(105deg)}80%{transform:rotate(60deg)}}
@keyframes am{0%,100%{transform:rotate(45deg)}50%{transform:rotate(-50deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes br{50%{transform:scale(1,1.03)}}
.road{animation:road .5s linear infinite}
@keyframes road{to{transform:translateX(-140px)}}
.arc{opacity:0;animation:arc 1.8s ease-out infinite}
@keyframes arc{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.trim1{animation:tr1 4s ease-in-out infinite alternate}.trim2{animation:tr2 4s ease-in-out infinite alternate}
@keyframes tr1{to{transform:translateX(26px)}}@keyframes tr2{to{transform:translateX(-30px)}}
.flick{animation:fl 1.1s steps(2) infinite}@keyframes fl{50%{opacity:.35}}
.cell{border-radius:2px;aspect-ratio:1;opacity:0;transition:opacity .4s calc(var(--i)*9ms)}
.on .cell{opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0b0e"/><stop offset=".65" stop-color="#3a1418"/><stop offset="1" stop-color="#1a0b0e"/></linearGradient>
<linearGradient id="gGR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1316"/><stop offset="1" stop-color="#0d0709"/></linearGradient>
<linearGradient id="gPine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07100D"/><stop offset="1" stop-color="#16342b"/></linearGradient>
<linearGradient id="gG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3b31"/><stop offset="1" stop-color="#08140f"/></linearGradient>
<linearGradient id="gDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1f19"/><stop offset=".55" stop-color="#1f5a46"/><stop offset="1" stop-color="#d9a441"/></linearGradient>
<radialGradient id="gSun"><stop offset="0" stop-color="#fde68a"/><stop offset=".4" stop-color="rgba(251,191,36,.45)"/><stop offset="1" stop-color="rgba(251,191,36,0)"/></radialGradient>
</defs></svg>
<div id="stage">
 <div id="scenes"></div>
 <div id="vig"></div>
 <div id="hud"><div id="act"></div><div id="scn"></div></div>
 <div id="bpm" class="glass"><svg viewBox="0 0 24 24"><path class="beat" d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z" fill="#10B981" filter="url(#glow)"/></svg><div id="bpmN">--</div><div id="bpmL">BPM</div></div>
 <div id="ecg" class="glass"><div class="lb"><span id="ecgM">ECG · derivación II · 100 Hz</span><span>25 mm/s</span></div><canvas id="cv"></canvas></div>
 <div id="sub"></div>
 <div id="ctrl" class="glass">
  <button id="bPrev" title="Anterior (←)" aria-label="Escena anterior">⏮</button>
  <button id="bPlay" class="pl" title="Play / Pausa (Espacio)" aria-label="Play o pausa">▶</button>
  <button id="bNext" title="Siguiente (→)" aria-label="Escena siguiente">⏭</button>
  <button id="bRst" title="Reiniciar (R)" aria-label="Reiniciar">↺</button>
  <div id="prog" title="Ir a…"><i id="progF"></i></div>
  <span id="tm">00:00 / 01:25</span>
  <button id="bAud" class="tg on" title="Audio (M)">Audio</button>
  <button id="bVoz" class="tg" title="Voz narradora es-ES (V)">Voz</button>
  <button id="bFs" title="Pantalla completa (F)" aria-label="Pantalla completa">⛶</button>
 </div>
 <div id="intro">
  <div class="ec" id="introEcg"></div>
  <h1><b>VITA</b>BAND</h1>
  <p>EL LENGUAJE SILENCIOSO DEL CORAZÓN · cortometraje de 85 s</p>
  <div><button id="goA">▶ Comenzar con audio</button><button id="goS" class="s">Sin sonido</button></div>
 </div>
</div>
<script>
"use strict";
/* ---------- utilidades ---------- */
let sd=7;function rnd(){sd|=0;sd=sd+0x6D2B79F5|0;let x=Math.imul(sd^sd>>>15,1|sd);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}
const gs=()=>(rnd()+rnd()+rnd()+rnd()-2)*1.7;
const $=id=>document.getElementById(id);
const T=85,GY=460;
/* ---------- forma ECG (P, QRS, T) ---------- */
const gg=(p,c,w,a)=>a*Math.exp(-.5*((p-c)/w)**2);
function shape(p){return gg(p,.12,.026,.14)+gg(p,.2,.007,-.14)+gg(p,.22,.009,1)+gg(p,.24,.008,-.25)+gg(p,.42,.05,.3)}
function mini(w,h,col,noisy,beats){beats=beats||3;let p='';for(let i=0;i<=w;i++){let v=shape(((i/w)*beats)%1);if(noisy)v=v*.55+(rnd()-.5)*.55;p+=i+','+(h*.7-v*h*.6).toFixed(1)+' '}
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%"><polyline points="'+p+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/></svg>'}
/* ---------- personajes SVG ---------- */
function fig(o){
 const s=o.s||1,f=o.flip||1,pose=o.pose||'stand',run=pose==='run',sit=pose==='sit';
 let top=o.top||'#10B981',bot=o.bot||'#1e3a32',skin=o.skin||'#e3b08d',hair=o.hair||'#2b1d16',shoe=o.shoe||'#e5e7eb';
 if(o.ghost){top=bot=skin=hair=shoe='#34d399'}
 const op=(o.op==null?1:o.op)*(o.ghost?.62:1),ph=o.ph||0;
 const st=(c,w)=>'stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" fill="none"';
 const leg=(d,dim)=>{const a=run?'animation-delay:'+(d+ph)+'s':'transform:rotate('+(sit?-88:(d?3:-3))+'deg)';const k=run?'animation-delay:'+(d+ph)+'s':'transform:rotate('+(sit?88:0)+'deg)';
  return '<g'+(dim?' opacity=".72"':'')+'><g class="'+(run?'lg':'')+'" style="'+a+';transform-origin:0 0"><line x1="0" y1="0" x2="0" y2="48" '+st(bot,15)+'/><g class="'+(run?'kn':'')+'" style="'+k+';transform-origin:0 48px"><line x1="0" y1="48" x2="0" y2="93" '+st(bot,13)+'/><path d="M-2 97h15" '+st(shoe,8)+'/></g></g></g>'};
 const arm=(d,dim,hold)=>{const aa=run?'animation-delay:'+(d+ph)+'s':'transform:rotate('+(sit?-35:(o.ar!=null&&!dim?o.ar:(dim?-4:6)))+'deg)';const ee=run?'':'transform:rotate('+(sit?-55:(o.eb!=null&&!dim?o.eb:-8))+'deg);';
  return '<g'+(dim?' opacity=".72"':'')+'><g class="'+(run?'am':'')+'" style="'+aa+';transform-origin:0 -50px"><line x1="0" y1="-50" x2="0" y2="-12" '+st(top,11)+'/><g class="'+(run?'el':'')+'" style="'+ee+'transform-origin:0 -12px"><line x1="0" y1="-12" x2="0" y2="23" '+st(skin,9)+'/>'+(hold||'')+'</g></g></g>'};
 const torso='<line x1="0" y1="0" x2="0" y2="-50" '+st(top,30)+'/>'+(o.strap?'<rect class="beat" x="-15" y="-42" width="30" height="7" rx="3" fill="#10B981" filter="url(#glow)"/>':'')+(o.extraTop||'')+
  '<line x1="0" y1="-50" x2="0" y2="-60" '+st(skin,9)+'/><circle cx="0" cy="-71" r="13" fill="'+skin+'"/><path d="M-13.500 -72a13.500 13.500 0 0 1 27 0c-6-5-14-6-27 0z" fill="'+hair+'"/>'+(o.hairX||'')+'<circle cx="6" cy="-70" r="1.6" fill="#10201a"/>';
 return '<g transform="translate('+o.x+' '+o.y+') scale('+(f*s)+' '+s+')" opacity="'+op+'"'+(o.ghost?' filter="url(#glow)"':'')+' style="--rd:'+(o.rd||'.7s')+'"><g class="'+(run?'bob':'')+'">'+leg(-.35,1)+
  '<g style="transform:rotate('+(run?10:sit?6:0)+'deg);transform-origin:0 0"><g class="'+(run?'':'br')+'">'+arm(-.35,1)+torso+arm(0,0,o.hold)+'</g></g>'+leg(0,0)+'</g></g>'}
const py=(s,pose)=>GY-(pose==='sit'?53:100)*s;
function chair(x,y,s){return '<g fill="#24443b" stroke="#24443b"><rect x="'+(x-27*s)+'" y="'+(y+6*s)+'" width="'+(46*s)+'" height="'+(9*s)+'" rx="3"/><rect x="'+(x-31*s)+'" y="'+(y-78*s)+'" width="'+(8*s)+'" height="'+(90*s)+'" rx="4"/><line x1="'+(x-4*s)+'" y1="'+(y+15*s)+'" x2="'+(x-4*s)+'" y2="'+GY+'" stroke-width="5"/><line x1="'+(x-32*s)+'" y1="'+GY+'" x2="'+(x+24*s)+'" y2="'+GY+'" stroke-width="5"/></g>'}
function desk(x1,x2,top,col){return '<g><rect x="'+x1+'" y="'+top+'" width="'+(x2-x1)+'" height="10" rx="3" fill="'+col+'"/><rect x="'+(x1+14)+'" y="'+(top+10)+'" width="7" height="'+(GY-top-10)+'" fill="'+col+'"/><rect x="'+(x2-21)+'" y="'+(top+10)+'" width="7" height="'+(GY-top-10)+'" fill="'+col+'"/></g>'}
function skyline(x0,x1,col){let r='';for(let x=x0;x<x1;x+=46){const h=60+rnd()*150;r+='<rect x="'+x+'" y="'+(GY-h)+'" width="40" height="'+h+'" fill="'+col+'"/>'}return r}
function dashes(y,col){let r='';for(let x=0;x<1500;x+=140)r+='<rect x="'+x+'" y="'+y+'" width="70" height="7" rx="3" fill="'+col+'"/>';return '<g class="road">'+r+'</g>'}
const ground=g=>'<rect y="'+GY+'" width="1280" height="260" fill="url(#'+g+')"/><line x1="0" x2="1280" y1="'+GY+'" y2="'+GY+'" stroke="rgba(16,185,129,.25)"/>';
const SVG=c=>'<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">'+c+'</svg>';
/* ---------- escenas ---------- */
const SC=[
{t0:0,t1:15,act:'ACTO I · EL RUIDO',name:'Rojo',chord:[110,116.54,164.81,207.65],subs:[[.3,'Marcos corre. Trabaja. Corre otra vez… y nunca sabe cuánto es demasiado.'],[7.5,'Su reloj dice una cosa. Su cuerpo, otra. Todo en rojo.']],
 html:()=>{const p=1.3,q=1.25,qy=py(q,'sit');return SVG('<rect width="1280" height="720" fill="url(#gRed)"/><circle cx="250" cy="330" r="190" fill="rgba(239,68,68,.12)"/>'+skyline(0,640,'#1a0d10')+
 '<rect x="640" width="640" height="720" fill="rgba(5,5,10,.55)"/><line x1="640" y1="0" x2="640" y2="720" stroke="rgba(239,68,68,.3)" stroke-dasharray="6 8"/>'+ground('gGR')+
 '<clipPath id="c1"><rect width="640" height="720"/></clipPath><g clip-path="url(#c1)">'+dashes(GY+70,'rgba(239,68,68,.45)')+'</g>'+
 fig({x:330,y:py(p,'run'),s:p,pose:'run',top:'#b45353',bot:'#2a1a1c',rd:'.62s'})+
 '<rect x="700" y="90" width="200" height="190" rx="6" fill="#0a0a12" stroke="rgba(239,68,68,.3)"/>'+Array.from({length:26},()=>'<rect x="'+(710+rnd()*180)+'" y="'+(100+rnd()*170)+'" width="5" height="5" fill="rgba(251,191,36,.5)"/>').join('')+
 '<text x="1130" y="130" fill="#f87171" font-size="34" font-family="monospace" class="flick">02:13</text>'+
 chair(900,qy,q)+desk(940,1250,qy-25*q,'#2a1a1c')+
 '<rect x="1040" y="'+(qy-25*q-92)+'" width="140" height="92" rx="6" fill="#1b0c0f" stroke="#ef4444"/><g class="flick">'+[0,1,2,3].map(i=>'<rect x="1052" y="'+(qy-25*q-80+i*20)+'" width="'+(40+rnd()*80)+'" height="8" rx="3" fill="#ef4444" opacity=".7"/>').join('')+'</g>'+
 fig({x:900,y:qy,s:q,pose:'sit',top:'#6b3a3a',bot:'#2a1a1c'}))+
 '<div class="card red" data-at=".5" style="left:6%;top:15%"><h4>⌚ Reloj óptico</h4><div class="big r"><span class="noisy" data-a="118" data-b="186">171</span></div><small>estimación con retraso</small></div>'+
 '<div class="card red" data-at="4" style="left:57%;top:13%"><h4>Panel nocturno</h4><p>Calorías: <span class="noisy" data-a="300" data-b="900">???</span></p><p>Zona: ¿?</p><p>Recuperación: —</p></div>'+
 '<div class="card red" data-at="9" style="left:30%;top:30%"><h4>Diagnóstico</h4><p>Sin ECG. Sin contexto.</p></div>'}},
{t0:15,t1:28,act:'ACTO II · LA CLARIDAD',name:'Claridad ECG',chord:[110,164.81,220,277.18],subs:[[.2,'Una banda pectoral. Cien muestras por segundo. Un latido real, por fin.'],[7,'Ya no es una estimación: es su electrocardiograma. 64 pulsaciones en calma.']],
 html:()=>{const p=1.3;return SVG('<rect width="1280" height="720" fill="url(#gPine)"/><circle cx="330" cy="300" r="220" fill="rgba(16,185,129,.07)"/>'+ground('gG')+
 [60,100,140,180].map((r,i)=>'<path class="arc" style="animation-delay:'+(i*.35)+'s" d="M 370 '+(310-r)+' A '+r+' '+r+' 0 0 1 370 '+(310+r)+'" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>').join('')+
 fig({x:330,y:py(p,'stand'),s:p,top:'#1f6f55',strap:1}))+
 '<div class="card" data-at=".8" style="left:50%;top:14%;width:44%"><h4>VitaBand · Escritorio</h4><div style="display:flex;gap:1.4em;align-items:center"><div><div class="big" style="font-size:4.2em">64</div><small>BPM · ECG real</small></div><div style="flex:1"><div style="font-size:.7em;color:var(--red)">Óptico ✕ <s style="color:#7a3b3b">estimado</s></div>'+mini(220,34,'#f87171',1,3)+'<div style="font-size:.7em;color:#6ee7b7;margin-top:.3em">ECG 100 Hz ✓</div>'+mini(220,34,'#10B981',0,3)+'</div></div></div>'+

function play(){if(t>=T-.05){t=0;idx=-1}playing=true;stage.classList.remove('paused');$('bPlay').textContent='❚❚';if(AC&&AC.state==='suspended')AC.resume();padOn(audioOn);
 if('speechSynthesis' in window&&speechSynthesis.paused)speechSynthesis.resume();else if(voiceOn&&curLine&&!speechSynthesis.speaking)speak(curLine);wake()}
function pause(){playing=false;stage.classList.add('paused');$('bPlay').textContent='▶';padOn(false);if('speechSynthesis' in window&&speechSynthesis.speaking)speechSynthesis.pause();wake()}
function seek(x){t=Math.max(0,Math.min(T-.01,x));acc=0;subKey='';stopVoice();update(0)}
function go(i){i=Math.max(0,Math.min(SC.length-1,i));seek(SC[i].t0+.01)}
$('bPlay').onclick=()=>playing?pause():play();
$('bNext').onclick=()=>go(sceneAt(t)+1);
$('bPrev').onclick=()=>{const i=sceneAt(t);go(t-SC[i].t0>2?i:i-1)};
$('bRst').onclick=()=>{seek(0);if(!playing)play()};
pr.onclick=e=>{const r=pr.getBoundingClientRect();seek((e.clientX-r.left)/r.width*T)};
function setAud(v){audioOn=v;$('bAud').classList.toggle('on',v);if(AC){master.gain.setTargetAtTime(v?.85:0,AC.currentTime,.1)}}
function setVoz(v){voiceOn=v;$('bVoz').classList.toggle('on',v);if(!v)stopVoice();else if(playing&&curLine)speak(curLine)}
$('bAud').onclick=()=>setAud(!audioOn);$('bVoz').onclick=()=>setVoz(!voiceOn);
function fs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
$('bFs').onclick=fs;
$('goA').onclick=()=>{setAud(true);start()};$('goS').onclick=()=>{setAud(false);start()};
function start(){initAudio();$('intro').style.display='none';seek(0);play()}
addEventListener('keydown',e=>{if($('intro').style.display!=='none'){if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}return}
 const k=e.key.toLowerCase();if(k===' '){e.preventDefault();playing?pause():play()}else if(k==='arrowright')go(sceneAt(t)+1);else if(k==='arrowleft')$('bPrev').click();else if(k==='f')fs();else if(k==='r')$('bRst').click();else if(k==='m')setAud(!audioOn);else if(k==='v')setVoz(!voiceOn);wake()});
let idleT;function wake(){$('ctrl').classList.remove('hide');stage.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(playing){$('ctrl').classList.add('hide');stage.classList.add('idle')}},2600)}
['mousemove','touchstart','click'].forEach(ev=>addEventListener(ev,wake));
function fit(){const w=stage.clientWidth;stage.style.fontSize=(w/1280*16)+'px';dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(10,cv.clientWidth*dpr);cv.height=Math.max(10,cv.clientHeight*dpr)}
addEventListener('resize',fit);fit();stage.classList.add('paused');update(0);requestAnimationFrame(frame);
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>
</body>
</html>
